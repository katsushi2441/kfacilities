# Kurage 施設検索 — 名古屋市（デモ版）の取り込み設定
#
# 事実（日時・種目・○×）だけを取り込み、各行に出典 URL と取得日時を付ける。
# PDF や表の転載はしない。数字・時間は公式サイト／おしえてダイヤル FAQ 724・726・728 を出典とする。
region: nagoya
name: 名古屋市
public_note: 名古屋市のスポーツセンター15施設と、中学校体育館の個人開放（地域スポーツセンター）を横断検索するデモです。
slots:
  午前: ["09:00", "12:00"]
  午後1: ["12:00", "15:00"]
  午後2: ["15:00", "18:00"]
  夜間: ["18:00", "21:00"]

# 共通の開館ルール（FAQ 724）: 平日・土曜・第2・4日曜 9:00–21:00、第1・3・5日曜・祝休日 9:00–18:00
x-hours-mon-closed: &hours_mon_closed
  - {days: [火, 水, 木, 金, 土], start: "09:00", end: "21:00", label: 開館, except_holiday: true}
  - {days: [日], nth: [2, 4], start: "09:00", end: "21:00", label: 開館, except_holiday: true}
  - {days: [日], nth: [1, 3, 5], start: "09:00", end: "18:00", label: 開館}
  - {days: [祝], start: "09:00", end: "18:00", label: 開館（祝休日）}
  - {days: [月], status: closed, label: 月曜休館, except_holiday: true}
x-hours-fri-closed: &hours_fri_closed
  - {days: [月, 火, 水, 木, 土], start: "09:00", end: "21:00", label: 開館, except_holiday: true}
  - {days: [日], nth: [2, 4], start: "09:00", end: "21:00", label: 開館, except_holiday: true}
  - {days: [日], nth: [1, 3, 5], start: "09:00", end: "18:00", label: 開館}
  - {days: [祝], start: "09:00", end: "18:00", label: 開館（祝休日）}
  - {days: [金], status: closed, label: 金曜休館, except_holiday: true}

x-dai2-note: &dai2_note 個人利用の種目は施設の案内に従ってください（武道・ダンス・ヨガ・体操など。板面＝フローリング、畳面＝畳）。○は「個人利用できる時間帯」で、混雑・満員は分かりません。
x-dai2-sports: &dai2_sports [武道, ダンス, ヨガ, エアロビクス, 体操]

